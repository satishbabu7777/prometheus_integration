name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: booking

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG} .

      - name: Tag Docker Image
        working-directory: .
        run: |
          docker tag \
          ${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG} \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}

      - name: Push Docker Image
        working-directory: .
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}

      - name: Update Helm values.yaml
        working-directory: .
        run: |
          sed -i "s|tag:.*|tag: ${IMAGE_TAG}|g" helm/booking-service/values.yaml

      - name: Show Updated values.yaml
        working-directory: .
        run: |
          cat helm/booking-service/values.yaml

      - name: Commit Helm Changes
        working-directory: .
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add helm/booking-service/values.yaml

          git commit -m "Update Helm image tag to ${IMAGE_TAG}" || echo "No changes"

      - name: Push Changes
        working-directory: .
        run: |
          git push origin main