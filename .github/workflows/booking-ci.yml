name: Booking CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: booking-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:${IMAGE_TAG} .

      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:${IMAGE_TAG} \
          530700192947.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:${IMAGE_TAG}

      - name: Push Docker Image
        run: |
          docker push 530700192947.dkr.ecr.ap-south-1.amazonaws.com/$ECR_REPOSITORY:${IMAGE_TAG}

      - name: Update Helm values.yaml
        run: |
          sed -i "s|tag:.*|tag: ${IMAGE_TAG}|g" helm/booking-service/values.yaml

      - name: Verify values.yaml
        run: |
          cat helm/booking-service/values.yaml

      - name: Commit Helm Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add helm/booking-service/values.yaml

          git commit -m "Update Helm image tag to ${IMAGE_TAG}" || echo "No changes"

      - name: Push Changes
        run: |
          git push origin main