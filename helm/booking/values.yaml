  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  springProfile: prod
  datasourceUrl: jdbc:postgresql://booking-db.abcdef123456.ap-south-1.rds.amazonaws.com:5432/bookingdb
  datasourceUsername: postgres

secret:
  datasourcePassword: "Satish89babu#"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70