apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booking
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/satishbabu7777/prometheus_integration.git
    targetRevision: main
    path: helm/booking

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true